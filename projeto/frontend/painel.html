<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Empresa - UBicho</title>

<link rel="stylesheet" href="painel.css">

</head>


<body>


<header>

<h1>🐾 Painel da Empresa</h1>

<p id="nomeEmpresa">
Carregando...
</p>

</header>



<main>


<section class="card">

<h2>Criar anúncio</h2>


<input 
id="titulo"
placeholder="Título do anúncio"
>


<textarea
id="descricao"
placeholder="Descrição do serviço">
</textarea>


<input
id="imagem"
placeholder="URL da imagem"
>


<button id="btnSalvar">
Cadastrar anúncio
</button>


</section>



<section class="card">


<h2>Meus anúncios</h2>


<div id="listaAnuncios">

</div>


</section>


</main>



<script src="painel.js"></script>


</body>

</html>
